name: Enterprise Backup CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  validate:
    name: Lint & Validate Infrastructure
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Bash scripts syntax & permissions
        run: |
          find . -name "*.sh" -type f | while read -r script; do
            echo "Checking $script..."
            bash -n "$script"
            test -x "$script" || (echo "ERROR: $script is not executable (+x)" && exit 1)
          done

      - name: Validate S3 JSON configuration
        run: python3 -m json.tool s3/s3.json > /dev/null

      - name: Validate Docker Compose manifests
        run: |
          sudo docker compose -f docker-compose.yml config --quiet
          sudo docker compose -f mssql/docker-compose.yml config --quiet
          echo "All Docker Compose configurations are valid."
